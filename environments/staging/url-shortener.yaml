global:
  environment: staging

image:
  tag: 1.0.3

replicaCount: 2

env:
  SHORTENER_BASE_URL: https://s.staging.dokan.com.bd

existingSecret: url-shortener-keys
database:
  existingSecret: url-shortener-db
  existingSecretKey: url
cache:
  url: rediss://shortener-staging.cache.internal:6380/0

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: s.staging.dokan.com.bd
  tls:
    - secretName: url-shortener-tls
      hosts: [s.staging.dokan.com.bd]

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  egress:
    enabled: true
    cidrs:
      - cidr: 10.40.0.0/20
        ports: [5432, 6380]
