# One store per cluster, backed by AWS Secrets Manager through IRSA.
# Swap the provider block for GCP Secret Manager, Vault or Azure Key Vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/part-of: commerce-platform
    - namespaces: [commerce-staging, commerce-prod]
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
