# The Secrets that environments/prod/payment-gateway.yaml refers to
# (existingSecret and database.existingSecret). Values live in the cloud
# secret manager under commerce/prod/payment-gateway/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-gateway-providers
  namespace: commerce-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: payment-gateway-providers
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BKASH_WEBHOOK_SECRET
      remoteRef:
        key: commerce/prod/payment-gateway/providers
        property: bkash_webhook_secret
    - secretKey: SSLCOMMERZ_WEBHOOK_SECRET
      remoteRef:
        key: commerce/prod/payment-gateway/providers
        property: sslcommerz_webhook_secret
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: commerce/prod/payment-gateway/providers
        property: stripe_webhook_secret
---
# Builds the SQLAlchemy URL from the managed database's rotated credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-gateway-db
  namespace: commerce-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: payment-gateway-db
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        url: "postgresql+psycopg://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:5432/payments?sslmode=require"
  dataFrom:
    - extract:
        key: commerce/prod/payment-gateway/rds
