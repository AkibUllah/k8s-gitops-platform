# One Application per (service, environment): every chart under charts/
# except the library, crossed with the environment list below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: commerce-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/AkibUllah/k8s-gitops-platform.git
              revision: main
              directories:
                - path: charts/*
                - path: charts/platform-lib
                  exclude: true
          - list:
              elements:
                - env: dev
                  server: https://kubernetes.default.svc
                  autoSync: "true"
                - env: staging
                  server: https://kubernetes.default.svc
                  autoSync: "true"
                - env: prod
                  server: https://kubernetes.default.svc
                  autoSync: "false"
  template:
    metadata:
      name: "{{ .path.basename }}-{{ .env }}"
      labels:
        platform.akibullah.dev/environment: "{{ .env }}"
        platform.akibullah.dev/service: "{{ .path.basename }}"
      annotations:
        notifications.argoproj.io/subscribe.on-sync-failed.slack: commerce-deploys
    spec:
      project: commerce
      source:
        repoURL: https://github.com/AkibUllah/k8s-gitops-platform.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../environments/{{ .env }}/{{ .path.basename }}.yaml"
      destination:
        server: "{{ .server }}"
        namespace: "commerce-{{ .env }}"
      # The demo PostgreSQL password is generated by the chart; Argo CD renders
      # with `helm template`, where lookup() cannot reuse the live value, so the
      # live data is kept and never diffed.
      ignoreDifferences:
        - kind: Secret
          name: "{{ .path.basename }}-postgresql"
          jsonPointers:
            - /data
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        managedNamespaceMetadata:
          labels:
            platform.akibullah.dev/environment: "{{ .env }}"
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
