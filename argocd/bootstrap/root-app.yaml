# App of apps. Apply once per cluster after installing Argo CD:
#   kubectl apply -n argocd -f argocd/bootstrap/root-app.yaml
# Everything else under argocd/ is then managed from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AkibUllah/k8s-gitops-platform.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: "bootstrap/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
